name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Configure
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        env:
          # No GPU on CI runners; software rendering keeps QtWebEngine alive.
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: ctest -C Release --output-on-failure --timeout 300
